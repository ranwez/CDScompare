# Install dependencies, run tests, lint, and build the package across supported Python versions.

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          python -m ruff check . --select E,F --ignore E501,F401

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Build package
        run: |
          python -m build

      - name: Check package metadata
        run: |
          python -m twine check dist/*
