[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cdscompare"
version = "0.3.0rc6"
description = "Compare CDS annotations from one or multiple GFF files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vincent Ranwez" },
    { name = "Johanna Girodolle" },
    { name = "Vetea Jacot" },
]
dependencies = [
  "attrs>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/ranwez/CDScompare"
Repository = "https://github.com/ranwez/CDScompare"
Issues = "https://github.com/ranwez/CDScompare/issues"

[project.optional-dependencies]
dev = [
  "build>=0.10",
  "twine>=4.0",
  "pytest>=8.0",
  "ruff>=0.1"
]
docs = [
  "sphinx>=7.0",
  "sphinx-autodoc-typehints",
  "furo",
]

[project.scripts]
cdscompare = "cdscompare.cli:main"

[tool.setuptools.packages.find]
exclude = ["cdscompare.tests*"]
